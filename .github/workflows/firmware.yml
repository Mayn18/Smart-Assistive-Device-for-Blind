name: ESP32 firmware build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Create compile-only credentials
        run: cp ESP32/secrets.h.example ESP32/secrets.h
      - name: Compile ESP32-CAM firmware
        run: pio run -e esp32cam
